<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>审核评价 · Review approval</title>
<script src="config.js"></script>
<style>
  body{margin:0;background:#F7F3EC;color:#2A251F;font-family:Inter,'Noto Sans SC',system-ui,sans-serif}
  .box{max-width:560px;margin:48px auto;padding:0 20px}
  h1{font-size:22px;margin:0 0 20px}
  .card{background:#F1EADF;padding:24px;border-radius:6px}
  .stars{color:#B8952E;font-size:20px}
  .body{font-size:16px;line-height:1.7;white-space:pre-line;margin:12px 0}
  .meta{font-size:13px;color:#5C5348}
  .row{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  button{min-height:48px;padding:0 24px;border-radius:999px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
  .yes{background:#2A251F;color:#FBF8F2;border:0}
  .no{background:transparent;color:#2A251F;border:1px solid #C9BCA6}
  .status{margin-top:20px;font-size:15px;padding:14px 16px;border-radius:4px;background:#FBF8F2}
</style>
</head>
<body>
<div class="box">
  <h1>审核客户评价 · Review approval</h1>
  <div id="out">载入中… Loading…</div>
</div>
<script>
(function () {
  var C = window.LY_CONFIG, q = new URLSearchParams(location.search);
  var id = q.get('id'), token = q.get('token'), want = q.get('action');
  var out = document.getElementById('out');
  var fn = C.SUPABASE_URL + '/functions/v1/review-action';
  var H = { apikey: C.SUPABASE_KEY, 'Content-Type': 'application/json' };
  var label = { pending: '待审核 Pending', approved: '已批准，已显示在网站 Approved — live on the website', rejected: '已拒绝，不会显示 Rejected — not shown' };
  function txt(tag, cls, t) { var e = document.createElement(tag); if (cls) e.className = cls; e.textContent = t; return e; }

  fetch(fn + '?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token), { headers: H })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.review) { out.textContent = '链接无效或评价不存在。 This link is invalid.'; return; }
      var r = d.review; out.innerHTML = '';
      var card = document.createElement('div'); card.className = 'card';
      card.appendChild(txt('div', 'stars', '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating)));
      card.appendChild(txt('div', 'body', r.body));
      card.appendChild(txt('div', 'meta', r.name + ' · ' + new Date(r.created_at).toLocaleString('en-MY', { timeZone: 'Asia/Kuala_Lumpur' })));
      out.appendChild(card);
      var st = txt('div', 'status', '目前状态 Status: ' + label[r.status]); out.appendChild(st);
      var row = document.createElement('div'); row.className = 'row';
      var yes = txt('button', 'yes', '批准并显示 Approve'), no = txt('button', 'no', '拒绝 Reject');
      if (want === 'reject') { row.appendChild(no); row.appendChild(yes); } else { row.appendChild(yes); row.appendChild(no); }
      out.appendChild(row);
      function act(a) {
        yes.disabled = no.disabled = true;
        fetch(fn, { method: 'POST', headers: H, body: JSON.stringify({ id: id, token: token, action: a }) })
          .then(function (r) { return r.json(); })
          .then(function (d) { st.textContent = d.ok ? ('完成 Done: ' + label[d.status]) : ('出错 Error: ' + (d.error || '')); })
          .catch(function () { st.textContent = '网络错误，请再试。 Network error, please retry.'; })
          .then(function () { yes.disabled = no.disabled = false; });
      }
      yes.onclick = function () { act('approve'); };
      no.onclick = function () { act('reject'); };
    })
    .catch(function () { out.textContent = '网络错误，请稍后再试。 Network error.'; });
})();
</script>
</body>
</html>
